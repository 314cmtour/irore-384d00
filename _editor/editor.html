<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iro:re 編集室</title>
<!-- 作品サイトの編集画面（2026-10-18）。手元の編集室（_editor/server.py）から開いたときだけ動く -->
<style>
  :root{--bg:#151412;--panel:#1e1c19;--line:#34302b;--ink:#e8e4dc;--mute:#8b867d;--accent:#d9c7a3;--warn:#e0a46a;--ok:#9fc29a;
    --sans:-apple-system,"Hiragino Sans","Helvetica Neue",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 var(--sans)}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(21,20,18,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  header h1{font-size:15px;font-weight:400;letter-spacing:.12em;margin:0 auto 0 0}
  #state{font-size:12px;color:var(--mute)}
  #vbar{position:sticky;top:57px;z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 20px;background:rgba(30,28,25,.96);border-bottom:1px solid var(--line)}
  #vbar .vlabel{font-size:11px;letter-spacing:.2em;color:var(--mute)}
  #vbar select{width:auto;min-width:240px;padding:4px 8px}
  #vnote{font-size:12px;color:var(--mute)}
  body.draft #vbar{background:rgba(58,46,24,.96)}
  body.draft #vnote{color:var(--accent)}
  #site{font-size:12px;color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(217,199,163,.35)}
  #site:hover{border-bottom-color:var(--accent)}
  #toast a{color:var(--accent)}
  @media (max-width:640px){#site{display:none}}
  #state.dirty{color:var(--warn)} #state.ok{color:var(--ok)}
  button{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer}
  button:hover{border-color:var(--mute)}
  button.primary{background:var(--accent);color:#1a1814;border-color:var(--accent)}
  button.small{padding:2px 9px;font-size:12px}
  button:disabled{opacity:.4;cursor:default}
  main{max-width:880px;margin:0 auto;padding:24px 20px 120px}
  h2{font-size:12px;font-weight:400;letter-spacing:.2em;color:var(--mute);margin:36px 0 12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0}
  .card.drop{outline:2px dashed var(--accent);outline-offset:-6px}
  .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .kind{font-size:11px;letter-spacing:.15em;color:var(--accent);margin-right:auto}
  label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
  input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:#141310;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  textarea{min-height:90px;resize:vertical;line-height:1.8}
  textarea.long{min-height:260px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .photo{display:grid;grid-template-columns:180px 1fr;gap:16px}
  .photo img{width:100%;border-radius:6px;background:#000;display:block}
  .hint{font-size:11px;color:var(--mute);margin-top:4px}
  .ins{display:flex;justify-content:center;gap:8px;padding:10px 0;opacity:.35;transition:opacity .2s}
  .ins:hover,.ins:focus-within{opacity:1}
  .dt{display:grid;grid-template-columns:140px 1fr auto;gap:8px;margin-bottom:8px;align-items:start}
  .dt textarea{min-height:40px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2722;border:1px solid var(--line);border-radius:8px;padding:10px 18px;white-space:pre-wrap;max-width:90vw;display:none;z-index:20}
  #toast.err{border-color:var(--warn);color:var(--warn)}
  #block-msg{padding:60px 20px;text-align:center;color:var(--mute)}
  @media (max-width:640px){.photo,.row{grid-template-columns:1fr}.dt{grid-template-columns:1fr}}
  /* iPhone：上の帯は折り返し、版の帯は固定しない（2026-10-18） */
  @media (max-width:640px){header{flex-wrap:wrap;padding:10px 14px}header h1{flex-basis:100%}#vbar{position:static}#vbar select{min-width:0;flex:1 1 100%}main{padding:16px 12px 120px}}
</style>
</head>
<body>
<header>
  <h1>iro:re 編集室</h1>
  <a id="site" href="https://314cmtour.github.io/irore-384d00/" target="_blank" rel="noopener" title="公開中のサイトを開く">314cmtour.github.io/irore-384d00 ↗</a>
  <span id="state">読み込み中…</span>
  <button id="preview">プレビュー</button>
  <button id="save">保存</button>
  <button id="publish" class="primary">公開</button>
</header>
<nav id="vbar">
  <span class="vlabel">版</span>
  <select id="vsel"></select>
  <button class="small" id="vnew">この版をもとに新しい版</button>
  <button class="small" id="vren">名前を変える</button>
  <button class="small" id="vdel">この版を消す</button>
  <span id="vnote"></span>
</nav>
<main id="app"></main>
<div id="toast"></div>
<input type="file" id="picker" accept="image/*,.heic,.heif" multiple hidden>

<script>
(() => {
  // 合言葉は編集室を開いたときの URL の # に付いてくる。タブを開いている間だけ覚えておく
  const h = location.hash.slice(1);
  if (h) { sessionStorage.setItem('irore-token', h); history.replaceState(null, '', location.pathname); }
  let TOKEN = sessionStorage.getItem('irore-token') || '';

  const app = document.getElementById('app');
  const stateEl = document.getElementById('state');
  let C = null, dirty = false;

  const LAYOUT = { full: '全幅', r60: '右寄せ（大）', l60: '左寄せ（大）', c40: '中央（小）' };
  const STYLE = { statement: 'はじめの文（大きめ）', concept: '本文（Concept など）', note: '注記（小さめ）' };
  const KIND = { text: '文章', photo: '写真', gallery: '写真のまとまり（1つの帯）', video: '動画（ループ）', teaser: 'ティーザー（YouTube）', data: '作品データ' };

  const toast = (msg, err) => { const t = document.getElementById('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 9000 : 3500); };
  let VER = sessionStorage.getItem('irore-ver') || 'live', VERS = [];
  const vq = () => '?v=' + encodeURIComponent(VER);
  const DRAFT_KEY = () => 'irore-draft:' + VER;
  const keepDraft = () => { try { localStorage.setItem(DRAFT_KEY(), JSON.stringify(C)); } catch (e) {} };
  const setDirty = (d) => { dirty = d; if (d) keepDraft(); else { try { localStorage.removeItem(DRAFT_KEY()); } catch (e) {} } stateEl.textContent = d ? '● 保存していない変更があります' : '保存済み'; stateEl.className = d ? 'dirty' : 'ok'; };
  const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else e.setAttribute(k, v); } kids.flat().forEach(k => k != null && e.append(k)); return e; };

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { 'X-Token': TOKEN, ...(opts.headers || {}) } });
    const j = await r.json().catch(() => ({ ok: false, error: '応答を読めませんでした' }));
    if (!r.ok || j.ok === false) throw new Error(j.error || r.statusText);
    return j;
  }

  // 入力欄：値を C に書き戻すだけ（画面は作り直さない＝打っている途中でカーソルが飛ばない）
  function field(obj, key, label, { long = false, multi = false, hint = '' } = {}) {
    const input = multi || long ? el('textarea', { class: long ? 'long' : '' }) : el('input', { type: 'text' });
    input.value = obj[key] ?? '';
    input.addEventListener('input', () => { obj[key] = input.value; setDirty(true); });
    return el('div', {}, el('label', {}, label), input, hint ? el('div', { class: 'hint' }, hint) : null);
  }
  function select(obj, key, label, options) {
    const s = el('select', {}, Object.entries(options).map(([v, t]) => el('option', { value: v }, t)));
    s.value = obj[key];
    s.addEventListener('change', () => { obj[key] = s.value; setDirty(true); });
    return el('div', {}, el('label', {}, label), s);
  }

  async function upload(file) {
    toast(`写真を取り込んでいます… ${file.name}`);
    const j = await api('/api/photo', { method: 'POST', headers: { 'X-Filename': encodeURIComponent(file.name) }, body: file });
    return j.src;
  }
  function pickFiles(multiple) {
    return new Promise(res => { const p = document.getElementById('picker'); p.multiple = multiple; p.value = ''; p.onchange = () => res([...p.files]); p.click(); });
  }
  function dropTarget(card, onFiles) {
    card.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); card.classList.add('drop'); } });
    card.addEventListener('dragleave', () => card.classList.remove('drop'));
    card.addEventListener('drop', e => { e.preventDefault(); card.classList.remove('drop'); const fs = [...e.dataTransfer.files].filter(f => /image|heic|heif/i.test(f.type + f.name)); if (fs.length) onFiles(fs); });
  }

  function move(i, d) { const b = C.blocks; const j = i + d; if (j < 0 || j >= b.length) return; [b[i], b[j]] = [b[j], b[i]]; setDirty(true); render(); }
  function remove(i) { const b = C.blocks[i]; if (!confirm(`この${KIND[b.type]}を外しますか？\n保存すると消えます。保存する前なら、ページを読み込み直せば元に戻ります。`)) return; C.blocks.splice(i, 1); setDirty(true); render(); }
  async function addPhotos(at, files) {
    try { for (const f of files) { const src = await upload(f); C.blocks.splice(at++, 0, { type: 'photo', layout: 'full', src, alt: '', caption: '' }); } setDirty(true); render(); toast('写真を入れました。配置とキャプションを決めて、保存してください'); }
    catch (e) { toast(e.message, true); }
  }
  function insertBar(at) {
    return el('div', { class: 'ins' },
      el('button', { class: 'small', onclick: () => { C.blocks.splice(at, 0, { type: 'text', style: 'concept', label: '', paragraphs: [''] }); setDirty(true); render(); } }, '＋ 文章'),
      el('button', { class: 'small', onclick: async () => { const fs = await pickFiles(true); if (fs.length) addPhotos(at, fs); } }, '＋ 写真'),
      el('button', { class: 'small', onclick: async () => { const fs = await pickFiles(true); if (!fs.length) return; try { const items = []; for (const f of fs) items.push({ src: await upload(f), alt: '' }); C.blocks.splice(at, 0, { type: 'gallery', items, caption: '' }); setDirty(true); render(); } catch (e) { toast(e.message, true); } } }, '＋ 写真のまとまり'));
  }

  function card(b, i) {
    const n = C.blocks.length;
    const head = el('div', { class: 'head' }, el('span', { class: 'kind' }, KIND[b.type] || b.type),
      el('button', { class: 'small', title: '上へ', onclick: () => move(i, -1), ...(i === 0 ? { disabled: '' } : {}) }, '↑'),
      el('button', { class: 'small', title: '下へ', onclick: () => move(i, 1), ...(i === n - 1 ? { disabled: '' } : {}) }, '↓'),
      el('button', { class: 'small', onclick: () => remove(i) }, '外す'));
    const c = el('section', { class: 'card' }, head);

    if (b.type === 'text') {
      const ta = el('textarea', { class: 'long' }); ta.value = b.paragraphs.join('\n\n');
      ta.addEventListener('input', () => { b.paragraphs = ta.value.split(/\n\s*\n/).map(s => s.replace(/^\n+|\n+$/g, '')); setDirty(true); });
      c.append(el('div', { class: 'row' }, select(b, 'style', '文字の大きさ', STYLE), field(b, 'label', '見出し（空なら出さない）')),
        el('label', {}, '本文'), ta, el('div', { class: 'hint' }, '空行で段落が分かれます。段落の中の改行は、そのまま改行になります。'));
    }
    if (b.type === 'photo') {
      const img = el('img', { src: '/' + b.src + '?t=' + Date.now(), alt: '' });
      const replace = async (files) => { try { b.src = await upload(files[0]); setDirty(true); render(); toast(files.length > 1 ? '1枚目で差し替えました（差し替えは1枚ずつです）' : '写真を差し替えました'); } catch (e) { toast(e.message, true); } };
      c.append(el('div', { class: 'photo' },
        el('div', {}, img, el('button', { class: 'small', style: 'margin-top:8px', onclick: async () => { const fs = await pickFiles(false); if (fs.length) replace(fs); } }, '差し替え'),
          el('div', { class: 'hint' }, 'ここに写真をドラッグしても差し替えられます')),
        el('div', {}, select(b, 'layout', '配置', LAYOUT), field(b, 'caption', 'キャプション（写真の下に出る。空なら出さない）', { multi: true }),
          field(b, 'alt', '写真の説明（画面には出ない。読み上げと検索用）'))));
      dropTarget(c, replace);
    }
    if (b.type === 'gallery') {
      const grid = el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:8px' });
      const draw = () => grid.replaceChildren(...b.items.map((it, j) => {
        const alt = el('input', { type: 'text', placeholder: '写真の説明（読み上げ用）' }); alt.value = it.alt || '';
        alt.addEventListener('input', () => { it.alt = alt.value; setDirty(true); });
        const mv = (d) => { const k = j + d; if (k < 0 || k >= b.items.length) return; [b.items[j], b.items[k]] = [b.items[k], b.items[j]]; setDirty(true); draw(); };
        return el('div', {}, el('img', { src: '/' + it.src, alt: '', style: 'width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;display:block' }),
          el('div', { style: 'display:flex;gap:4px;margin:6px 0' },
            el('button', { class: 'small', onclick: () => mv(-1) }, '←'), el('button', { class: 'small', onclick: () => mv(1) }, '→'),
            el('button', { class: 'small', onclick: () => { if (b.items.length === 1) return toast('最後の1枚は外せません。まとまりごと「外す」を使ってください', true); b.items.splice(j, 1); setDirty(true); draw(); } }, '×')), alt);
      }));
      draw();
      const add = async (files) => { try { for (const f of files) b.items.push({ src: await upload(f), alt: '' }); setDirty(true); draw(); toast('写真を足しました'); } catch (e) { toast(e.message, true); } };
      c.append(grid, el('button', { class: 'small', onclick: async () => { const fs = await pickFiles(true); if (fs.length) add(fs); } }, '＋ 写真を足す'),
        el('div', { class: 'hint' }, '2列で並びます。枚数が奇数のときは1枚目が横いっぱいになります。ここに写真をドラッグしても足せます。'),
        field(b, 'caption', 'キャプション（まとまりの下に1つ出る）', { multi: true }));
      dropTarget(c, add);
    }
    if (b.type === 'video') {
      c.append(el('div', { class: 'photo' }, el('img', { src: '/' + b.poster, alt: '' }),
        el('div', {}, select(b, 'layout', '配置', LAYOUT), field(b, 'caption', 'キャプション（動画の下に出る。空なら出さない）', { multi: true }), field(b, 'alt', '動画の説明（画面には出ない。読み上げ用）'),
          el('div', { class: 'hint' }, `動画ファイル：${b.src}（動画の差し替えは秘書に頼んでください）`))));
    }
    if (b.type === 'teaser') {
      const img = el('img', { src: '/' + b.poster + '?t=' + Date.now(), alt: '' });
      const replace = async (files) => { try { b.poster = await upload(files[0]); setDirty(true); render(); } catch (e) { toast(e.message, true); } };
      c.append(el('div', { class: 'photo' },
        el('div', {}, img, el('button', { class: 'small', style: 'margin-top:8px', onclick: async () => { const fs = await pickFiles(false); if (fs.length) replace(fs); } }, '表紙の画像を差し替え')),
        el('div', {}, field(b, 'youtube', 'YouTube の動画 ID（youtu.be/ の後ろの11文字）'), field(b, 'meta', '動画の上の小さな文字（例：TEASER　3:03）'),
          field(b, 'caption', 'キャプション'), field(b, 'alt', '表紙の画像の説明（読み上げ用）'))));
      dropTarget(c, replace);
    }
    if (b.type === 'data') {
      const rows = el('div');
      const draw = () => { rows.replaceChildren(...b.rows.map((r, j) => {
        const k = el('input', { type: 'text' }); k.value = r.k; k.addEventListener('input', () => { r.k = k.value; setDirty(true); });
        const v = el('textarea'); v.value = r.v; v.addEventListener('input', () => { r.v = v.value; setDirty(true); });
        return el('div', { class: 'dt' }, k, v, el('button', { class: 'small', onclick: () => { b.rows.splice(j, 1); setDirty(true); draw(); } }, '×'));
      })); };
      draw();
      c.append(field(b, 'label', '見出し'), el('label', {}, '項目と内容'), rows,
        el('button', { class: 'small', onclick: () => { b.rows.push({ k: '', v: '' }); setDirty(true); draw(); } }, '＋ 項目'));
    }
    return c;
  }

  function render() {
    const y = scrollY;
    const basics = el('section', { class: 'card' },
      el('div', { class: 'row' }, field(C.hero, 'name', '題字'), field(C.hero, 'sub', '題字の下の一行')),
      field(C.meta, 'title', 'ページの題名（ブラウザのタブに出る）'),
      field(C.meta, 'description', '説明文（検索や共有のときに出る）', { multi: true }),
      field(C.meta, 'ogDescription', '共有したときの一言', { multi: true }),
      (() => { const photos = C.blocks.filter(b => b.type === 'photo').map(b => b.src);
        const s = el('select', {}, [...new Set([C.meta.ogImage, ...photos])].map(p => el('option', { value: p }, p.replace('media/', ''))));
        s.value = C.meta.ogImage; s.addEventListener('change', () => { C.meta.ogImage = s.value; setDirty(true); });
        return el('div', {}, el('label', {}, 'SNS で共有したときに出る写真'), s); })(),
      field(C, 'footer', 'いちばん下の一行'));
    const list = [];
    C.blocks.forEach((b, i) => { list.push(insertBar(i), card(b, i)); });
    list.push(insertBar(C.blocks.length));
    const tail = el('section', { class: 'card' }, el('div', { class: 'hint' }, '写真をここにドラッグすると、いちばん下に足せます。'));
    dropTarget(tail, fs => addPhotos(C.blocks.length, fs));
    app.replaceChildren(el('h2', {}, '基本'), basics, el('h2', {}, '上から順に（トップの動画のあと）'), ...list, tail);
    scrollTo(0, y);
  }

  async function save() {
    await api('/api/content' + vq(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(C) });
    setDirty(false);
  }
  document.getElementById('save').onclick = async () => { try { await save(); toast('保存しました（まだ公開していません）'); } catch (e) { toast(e.message, true); } };
  document.getElementById('preview').onclick = async () => {
    const w = window.open('about:blank', '_blank');
    try { if (dirty) await save(); w.location = (VER === 'live' ? '/index.html' : '/preview-' + VER + '.html') + '?t=' + Date.now(); } catch (e) { w.close(); toast(e.message, true); }
  };
  document.getElementById('publish').onclick = async (ev) => {
    const vname = (VERS.find(v => v.id === VER) || {}).name || '';
    if (!confirm(VER === 'live' ? 'サイトに公開しますか？\n押すと、今の内容が数分でネットに出ます。'
      : `「${vname}」をサイトに公開しますか？\n今公開中の版は「公開していた版」として一覧に残ります。`)) return;
    const b = ev.currentTarget; b.disabled = true; toast('公開しています…');
    try { if (dirty) await save(); const j = await api('/api/publish' + vq(), { method: 'POST' }); showPublished(j); if (VER !== 'live') { await switchTo('live', true); } }
    catch (e) { toast(e.message, true); } finally { b.disabled = false; }
  };
  const SITE = 'https://314cmtour.github.io/irore-384d00/';
  function showPublished(j) {
    const t = document.getElementById('toast'); clearTimeout(t._h);
    const url = SITE + '?v=' + Date.now().toString(36);
    t.className = ''; t.replaceChildren(
      document.createTextNode(j.message + (j.removed && j.removed.length ? `\n使っていない写真 ${j.removed.length} 枚を外しました` : '') + '\n公開後のアドレス：'),
      Object.assign(document.createElement('a'), { href: url, target: '_blank', rel: 'noopener', textContent: SITE }),
      document.createTextNode('\n（反映まで数分。リンクは古い表示を飛ばす印つき）'));
    t.style.display = 'block'; t._h = setTimeout(() => t.style.display = 'none', 30000);
  }
  async function loadVersions() {
    VERS = (await (await fetch('/api/versions')).json()).versions;
    if (!VERS.some(v => v.id === VER)) VER = 'live';
    const sel = document.getElementById('vsel');
    sel.replaceChildren(...VERS.map(v => el('option', { value: v.id }, v.id === 'live' ? '● 公開中の版' : `${v.name}　（${v.updated}）`)));
    sel.value = VER;
  }
  async function switchTo(v, force) {
    if (!force && dirty && !confirm('保存していない変更があります。保存せずに版を切り替えますか？\n（書きかけは、その版に戻ったときに戻せます）')) { document.getElementById('vsel').value = VER; return; }
    VER = v; sessionStorage.setItem('irore-ver', VER);
    await loadVersions();
    document.body.classList.toggle('draft', VER !== 'live');
    document.getElementById('vnote').textContent = VER === 'live' ? 'いまサイトに出ている内容です' : '下書きの版です。保存してもサイトには出ません。「公開」を押すとこの版に入れ替わります';
    document.getElementById('vren').disabled = document.getElementById('vdel').disabled = VER === 'live';
    C = await (await fetch('/api/content' + vq())).json();
    let draft = null; try { draft = localStorage.getItem(DRAFT_KEY()); } catch (e) {}
    if (draft && draft !== JSON.stringify(C) && confirm('この版に、保存しないまま閉じた書きかけがあります。戻しますか？\n（「キャンセル」で書きかけを捨てます）')) { C = JSON.parse(draft); render(); setDirty(true); }
    else { render(); setDirty(false); }
  }
  document.getElementById('vsel').onchange = (e) => switchTo(e.target.value).catch(err => toast(err.message, true));
  document.getElementById('vnew').onclick = async () => {
    const name = prompt('新しい版の名前（例：わかりやすい版）', 'わかりやすい版');
    if (name == null) return;
    try { if (dirty) await save(); const j = await api('/api/versions/new', { method: 'POST', body: JSON.stringify({ from: VER, name }) }); await switchTo(j.id, true); toast(`「${name}」を作りました。今の版の内容が写してあります`); }
    catch (e) { toast(e.message, true); }
  };
  document.getElementById('vren').onclick = async () => {
    const cur = (VERS.find(v => v.id === VER) || {}).name || '';
    const name = prompt('版の名前', cur); if (!name) return;
    try { if (dirty) await save(); await api('/api/versions/rename' + vq(), { method: 'POST', body: JSON.stringify({ name }) }); await loadVersions(); } catch (e) { toast(e.message, true); }
  };
  document.getElementById('vdel').onclick = async () => {
    const cur = (VERS.find(v => v.id === VER) || {}).name || '';
    if (!confirm(`「${cur}」を消しますか？\nこの版は元に戻せません（サイトに出ている内容には影響しません）。`)) return;
    try { await api('/api/versions/delete' + vq(), { method: 'POST' }); try { localStorage.removeItem(DRAFT_KEY()); } catch (e) {} await switchTo('live', true); toast('消しました'); } catch (e) { toast(e.message, true); }
  };
  addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  (async () => {
    if (!TOKEN) { try { TOKEN = (await (await fetch('/api/token')).json()).token || ''; sessionStorage.setItem('irore-token', TOKEN); } catch (e) {} }
    if (!TOKEN) { app.replaceChildren(el('div', { id: 'block-msg' }, '「編集室.command」から開き直してください。')); stateEl.textContent = ''; return; }
    try { await switchTo(VER, true); }
    catch (e) { app.replaceChildren(el('div', { id: 'block-msg' }, '編集室が動いていません。「編集室.command」から開き直してください。')); }
  })();
})();
</script>
</body>
</html>
